services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=diffusion
      - POSTGRES_PASSWORD=diffusion
      - POSTGRES_DB=diffusion_viewer
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diffusion -d diffusion_viewer"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://diffusion:diffusion@postgres:5432/diffusion_viewer
      - IMAGE_DIR=/images
    volumes:
      - ./backend:/app
      - backend-thumbnails:/app/thumbnails
      - ${IMAGE_DIR:-./images}:/images
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8065:80"
    depends_on:
      - backend
    restart: unless-stopped

  frontend-dev:
    image: node:20-alpine
    profiles:
      - dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - VITE_PROXY_TARGET=http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped


volumes:
  postgres-data:
  backend-thumbnails:
  frontend-node-modules:
