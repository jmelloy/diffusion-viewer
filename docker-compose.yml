services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/diffusion_viewer.db
    volumes:
      - ./backend:/app
      - backend-data:/data
      - backend-thumbnails:/app/thumbnails
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8065:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  # Uncomment to use a named volume for images instead of the bind mount above:
  # images_data:
  db_data:
  thumbnails_data:
    container_name: diffusion-viewer-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/diffusion_viewer.db
    volumes:
      - ./backend:/app
      - backend-data:/data
      - backend-thumbnails:/app/thumbnails
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

volumes:
  backend-data:
  backend-thumbnails:
