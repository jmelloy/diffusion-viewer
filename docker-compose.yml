services:
  backend:
    build: ./backend
    # Port 8000: photosafe also defaults to 8000 — set BACKEND_PORT there if both run on the same host
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/diffusion_viewer.db
    volumes:
      - backend-data:/data
      - backend-thumbnails:/app/thumbnails
      # To serve images from a host directory, add:
      # - /path/to/your/images:/app/images
      # Or to use a named volume, uncomment images_data below and add:
      # - images_data:/app/images
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build: ./frontend
    # Port 8065: no conflicts with other deployed services
    ports:
      - "8065:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  backend-data:
  backend-thumbnails:
  # images_data:
