services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount your local images folder so the scanner can reach them.
      # Change ./images to any absolute path on your host, e.g. /mnt/nas/sd-outputs
      - ./images:/app/images
      # Alternative: use a named volume instead of a bind mount (uncomment both lines):
      # - images_data:/app/images
      - db_data:/app/data
      - thumbnails_data:/app/thumbnails
    environment:
      DATABASE_URL: sqlite:////app/data/diffusion_viewer.db
      THUMBNAIL_DIR: /app/thumbnails
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8065:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  # Uncomment to use a named volume for images instead of the bind mount above:
  # images_data:
  db_data:
  thumbnails_data:
