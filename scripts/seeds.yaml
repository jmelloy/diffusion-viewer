# Seed projects for auto_organize.py.
#
# Each project has:
#   name           — what to call it (becomes `project:Name`)
#   roles          — ordered map of role-name → list of keywords. Each keyword
#                    is matched against image prompt + description (case-
#                    insensitive whole-word). Matched keywords become tags
#                    parented under `project:Name:<role>`. The role name is
#                    optional; an entry without `roles` falls back to a flat
#                    `keywords:` list (no sub-category).
#
# An image is attached to every project whose keywords (across any role) it
# matches at least once. Each individual keyword that matches becomes a child
# tag of its role, and the image is tagged with that child too.
#
# Edit freely. The script is idempotent — re-running adds new tags but won't
# duplicate links.

projects:
  - name: "Alien Encounter"
    roles:
      character:
        - sara
        - michelle
        - brianna
        - bri
        - cady
        - stephen
      scene:
        - waitress
        - diner
        - basement
        - lab
        - une petite aventure

